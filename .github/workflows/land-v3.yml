name: Validate V3 candidate
on:
  push:
    branches: [master]
    paths: ['.github/workflows/land-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-v3
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff4c235aa859e3ff2612455ea6e2ffcc5e1083f3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair frontend lock within existing version ranges
        working-directory: frontend
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Improve validation diagnostics and Chinese font fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/index.css')
          s = p.read_text().replace('"Inter", -apple-system, BlinkMacSystemFont, sans-serif', '"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif')
          p.write_text(s, encoding='utf-8')
          p = Path('.github/workflows/verify.yml')
          s = p.read_text()
          marker = '      - name: Install test browser\n'
          insertion = '      - name: Audit frontend dependencies\n        working-directory: frontend\n        run: npm audit --audit-level=high\n      - name: Install Chinese fonts for Linux visual verification\n        if: runner.os == \'Linux\'\n        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk\n'
          assert marker in s
          p.write_text(s.replace(marker, insertion + marker), encoding='utf-8')
          PY
          git add -u
          git archive --format=tar -o source.tar "$(git write-tree)"
      - name: Prepare immutable commit without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          def api(path, data=None):
              request = urllib.request.Request(root + path, data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request) as response: return json.load(response)
          candidate = api('/git/commits/ff4c235aa859e3ff2612455ea6e2ffcc5e1083f3')
          paths = [pathlib.Path(p) for p in subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()]
          tree = api('/git/trees', {'base_tree': candidate['tree']['sha'], 'tree': [
              {'path': path.as_posix(), 'mode': '100644', 'type': 'blob', 'content': path.read_text(encoding='utf-8')} for path in paths]})
          commit = api('/git/commits', {'message': 'refactor: ship curated tool collection with shared web/Windows launcher and locked builds',
              'tree': tree['sha'], 'parents': [os.environ['GITHUB_SHA']]})
          report = {'candidate_sha': commit['sha'], 'tree_sha': tree['sha'], 'parent_sha': os.environ['GITHUB_SHA']}
          pathlib.Path('candidate.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v3-source
          path: |
            source.tar
            candidate.json
          retention-days: 7
  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v3-source
      - name: Restore candidate source
        run: tar -xf source.tar
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Record frontend dependency audit
        if: runner.os == 'Linux'
        working-directory: frontend
        run: mkdir -p ../verification && npm audit --json > ../verification/npm-audit.json
      - name: Restore locked build environment
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --group build --group test
      - name: Build web and native desktop outputs
        run: uv run --locked --group build --group test python build.py
      - name: Install Chinese fonts for Linux visual verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install test browser
        run: uv run --locked --group test python -m playwright install chromium
      - name: Live runtime, uploads, downloads and browser navigation
        run: uv run --locked --group test python -m scripts.integration_check --ui
      - name: Frozen Windows executable and WebView2 tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VIBEHUB_DATA_DIR: ${{ github.workspace }}\.runtime\frozen
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          $p = Start-Process -FilePath 'release/windows/VibeHub.exe' -ArgumentList '--smoke-test --report verification/frozen.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath 'release/windows/VibeHub.exe' -ArgumentList '--gui-smoke-test --report verification/webview2.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WebView2 smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-verification-${{ runner.os }}
          include-hidden-files: true
          path: |
            candidate.json
            verification/
            .runtime/frozen/desktop-error.log
            .runtime/frozen/logs/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-web-${{ runner.os }}
          path: release/VibeHub-web.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: candidate-windows-x64
          path: release/windows/
          retention-days: 14
