name: Verify and build
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore locked build environment
        run: |
          python -m pip install uv==0.8.22
          uv sync --locked --group build --group test
      - name: Build web and native desktop outputs
        run: uv run --locked --group build --group test python build.py
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Install Chinese fonts for Linux visual verification
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install test browser
        run: uv run --locked --group test python -m playwright install chromium
      - name: Live uv/Caddy, uploads, downloads, browser navigation and shutdown
        run: uv run --locked --group test python -m scripts.integration_check --ui
      - name: Frozen Windows executable smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VIBEHUB_DATA_DIR: ${{ github.workspace }}\.runtime\frozen
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          $p = Start-Process -FilePath 'release/windows/VibeHub.exe' -ArgumentList '--smoke-test --report verification/frozen.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath 'release/windows/VibeHub.exe' -ArgumentList '--gui-smoke-test --report verification/webview2.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WebView2 smoke test failed: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ runner.os }}
          include-hidden-files: true
          path: |
            verification/
            .runtime/frozen/desktop-error.log
            .runtime/frozen/logs/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ runner.os }}
          path: release/VibeHub-web.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-x64
          path: release/windows/
          retention-days: 14
