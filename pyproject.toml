[project]
name = "vibehub"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "psutil>=6.0",
]

[dependency-groups]
desktop = ["pywebview==6.2.1; sys_platform == 'win32'"]
test = ["pillow>=11", "pymupdf>=1.25", "python-multipart>=0.0.20", "playwright==1.55.0"]
build = [{include-group = "desktop"}, "pyinstaller==6.16.0", "pillow>=11"]
